<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Distributed System</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .login-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            padding: 40px;
            width: 100%;
            max-width: 420px;
            transition: transform 0.2s;
        }
        .login-card:hover {
            transform: translateY(-5px);
        }
        h2 {
            margin-top: 0;
            margin-bottom: 24px;
            color: #333;
            text-align: center;
            font-weight: 600;
            font-size: 28px;
        }
        .error-box {
            background-color: #fee2e2;
            border-left: 5px solid #dc2626;
            color: #991b1b;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 24px;
            font-size: 14px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: #444;
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 12px;
            font-size: 16px;
            transition: 0.2s;
        }
        input:focus {
            border-color: #667eea;
            outline: none;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.2);
        }
        button {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }
        .footer {
            text-align: center;
            margin-top: 24px;
            color: #888;
            font-size: 12px;
        }
        .demo-credentials {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 12px;
            margin-top: 20px;
            font-size: 13px;
            text-align: center;
            color: #555;
        }
        .demo-credentials span {
            font-family: monospace;
            background: #e9ecef;
            padding: 2px 6px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>🔐 Welcome</h2>
        {{if .Error}}
        <div class="error-box">
            ⚠️ {{.Error}}
        </div>
        {{end}}
        <form method="post">
            <label>👤 Username</label>
            <input type="text" name="username" placeholder="e.g., alice" required autofocus>
            <label>🔒 Password</label>
            <input type="password" name="password" placeholder="••••••" required>
            <button type="submit">Login →</button>
        </form>
        <div class="demo-credentials">
            📋 <strong>Test credentials</strong><br>
            <span>alice</span> / <span>alice123</span> &nbsp;|&nbsp;
            <span>bob</span> / <span>bob123</span> &nbsp;|&nbsp;
            <span>admin</span> / <span>admin123</span>
        </div>
        <div class="footer">
            Distributed Systems Assignment 2
        </div>
    </div>
</body>
</html>
